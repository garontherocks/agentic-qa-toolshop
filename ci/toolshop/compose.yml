# Toolshop (Sprint 5) for CI, started from Testsmith's published images on Docker Hub.
# Mirrors docker-compose.prod.yml in testsmith-io/practice-software-testing, minus the cron and phpMyAdmin
# services. Nothing from Toolshop is copied into this repo: the images are pulled at run time.
# Toolshop is © Testsmith, all rights reserved; see docs/ci-toolshop.md for how this repo uses it.
#
# UI  http://localhost:4200   (Angular dev server; its API URL is http://localhost:8091)
# API http://localhost:8091
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=false
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    image: testsmith/practice-software-testing-web
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  # Registration and password reset may send mail; catch it locally instead of failing the request.
  mail:
    image: dockage/mailcatcher:0.9.0
    networks:
      default:
        aliases: [mailpit, mailcatcher]

volumes:
  laravel-app-code:

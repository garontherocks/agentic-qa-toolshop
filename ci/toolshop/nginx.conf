# Front for the Laravel API (php-fpm in laravel-api:9000), equivalent to Testsmith's web image.
# Their testsmith/practice-software-testing-web image is published for arm64 only, so CI (amd64) uses the
# official nginx image with this file instead.
server {
    listen 80;
    root /var/www/public;
    index index.php;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }
}
